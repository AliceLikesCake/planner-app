<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>新增待辦</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3A36}a:hover{color:#1F1D1B}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #FAF7F2; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3D3A36; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 50px 12px 6px">
    <a href="Main.dc.html" style="height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; color: #6E6860; text-decoration: none">取消</a>
    <div style="font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 19px">新增待辦</div>
    <a href="Main.dc.html" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #3D3A36; color: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">儲存</a>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 14px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <label for="t-title" style="font-size: 12px; font-weight: 700; color: #6E6860">要做什麼？</label>
      <input id="t-title" type="text" value="回覆品牌 A 修改意見" style="border: none; outline: none; font-size: 18px; font-weight: 700; color: #3D3A36; padding: 4px 0; background: transparent">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 700; padding: 0 4px">類別</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
            <span style="{{c.dot}}"></span>{{c.name}}
          </button>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{isCollab}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 12px; font-weight: 700; color: #6E6860">關聯的接案（選填）</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{deals}}" as="d" hint-placeholder-count="3">
            <button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="{{d.style}}">{{d.name}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #F3EEE7">
        <label for="t-date" style="font-size: 15px">日期</label>
        <input id="t-date" type="text" value="10月23日（五）" style="border: none; outline: none; text-align: right; font-size: 15px; font-weight: 700; color: #3D3A36; background: transparent; width: 150px">
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #F3EEE7">
        <label for="t-time" style="font-size: 15px">時間（選填）</label>
        <input id="t-time" type="text" value="12:30" style="border: none; outline: none; text-align: right; font-size: 15px; font-weight: 700; color: #3D3A36; background: transparent; width: 120px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 0 14px">
        <div style="font-size: 15px">重複</div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{repeats}}" as="r" hint-placeholder-count="4">
            <button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="{{r.style}}">{{r.label}}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 16px">
      <sc-for list="{{toggles}}" as="tg" hint-placeholder-count="2">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 60px; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px">{{tg.label}}</span>
            <span style="font-size: 12px; color: #6E6860">{{tg.sub}}</span>
          </div>
          <button onClick="{{tg.flip}}" role="switch" aria-checked="{{tg.on}}" aria-label="{{tg.label}}" style="{{tg.track}}">
            <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <label for="t-note" style="font-size: 12px; font-weight: 700; color: #6E6860">備註</label>
      <textarea id="t-note" rows="2" style="border: none; outline: none; resize: none; font-size: 15px; color: #3D3A36; padding: 2px 0; background: transparent">記得附上修改後的截圖</textarea>
    </div>

    <div style="background: #F1ECE4; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; font-weight: 700; color: #5A544C">儲存後會同步到</div>
      <sc-for list="{{syncs}}" as="sy" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5A544C">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          <span>{{sy.t}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'collab', deal: 'a', repeat: 'none', remind: true, cal: true };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var cats = [
      { id: 'work', name: '工作', fill: '#DCE8F5', text: '#3E5F8F', deep: '#7FA3CF' },
      { id: 'collab', name: '接案', fill: '#E8E0F3', text: '#65508F', deep: '#A891CC' },
      { id: 'study', name: '學習', fill: '#DDEBDD', text: '#3D6442', deep: '#8DB58F' },
      { id: 'life', name: '生活', fill: '#F6EBC8', text: '#7F6224', deep: '#D9BC6E' },
      { id: 'health', name: '健康', fill: '#F5DADA', text: '#8E3F3F', deep: '#DE9C9C' }
    ];
    var curCat = cats.filter(function (c) { return c.id === st.cat; })[0];
    function chip(on) {
      return 'height: 38px; padding: 0 14px; border-radius: 19px; border: none; cursor: pointer; font-size: 13px; font-weight: ' + (on ? '700' : '500') + '; background: ' + (on ? '#3D3A36' : '#F5F1EA') + '; color: ' + (on ? '#FFFFFF' : '#5A544C');
    }
    var deals = [{ id: 'a', name: '品牌 A' }, { id: 'f', name: '品牌 F' }, { id: 'd', name: '品牌 D' }, { id: 'none', name: '不關聯' }].map(function (d) {
      var on = d.id === st.deal;
      return { name: d.name, pressed: on ? 'true' : 'false', style: chip(on), pick: function () { self.setState({ deal: d.id }); } };
    });
    var repeats = [{ id: 'none', label: '不重複' }, { id: 'day', label: '每天' }, { id: 'week', label: '每週' }, { id: 'month', label: '每月' }].map(function (r) {
      var on = r.id === st.repeat;
      return { label: r.label, pressed: on ? 'true' : 'false', style: chip(on) + '; padding: 0', pick: function () { self.setState({ repeat: r.id }); } };
    });
    function toggle(key, label, sub) {
      var on = !!st[key];
      return {
        label: label, sub: sub, on: on ? 'true' : 'false',
        flip: function () { var p = {}; p[key] = !self.state[key]; self.setState(p); },
        track: 'width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; cursor: pointer; flex-shrink: 0; display: flex; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#8DB58F' : '#D9D2C7')
      };
    }
    var syncs = [{ t: '10/23 的今日待辦，完成時疊上一層' + curCat.name + '蛋糕' }];
    if (st.cal) syncs.push({ t: '月曆 10/23 的待辦事項清單' });
    if (st.cat === 'collab' && st.deal !== 'none') syncs.push({ t: '接案頁「' + deals.filter(function (d) { return d.pressed === 'true'; })[0].name + '」的相關待辦' });
    if (st.remind) syncs.push({ t: '12:00 推播提醒' });
    return {
      cats: cats.map(function (c) {
        var on = c.id === st.cat;
        return {
          name: c.name,
          pressed: on ? 'true' : 'false',
          pick: function () { self.setState({ cat: c.id }); },
          dot: 'width: 10px; height: 10px; border-radius: 50%; background: ' + c.deep,
          style: 'height: 44px; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; border: 2px solid ' + (on ? c.deep : 'transparent') + '; background: ' + (on ? c.fill : '#FFFFFF') + '; color: ' + (on ? c.text : '#5A544C') + '; font-weight: ' + (on ? '700' : '500')
        };
      }),
      isCollab: st.cat === 'collab',
      deals: deals,
      repeats: repeats,
      toggles: [toggle('remind', '提醒我', '開始前 30 分鐘通知'), toggle('cal', '顯示在月曆', '在月曆的那天也看得到')],
      syncs: syncs
    };
  }
}
</script>
</body>
</html>
