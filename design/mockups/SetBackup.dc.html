<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>帳號與備份</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3A36}a:hover{color:#1F1D1B}
button{font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #FAF7F2; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3D3A36; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 50px 12px 6px">
    <a href="Settings.dc.html" aria-label="返回設定" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 22px">帳號與備份</div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; height: 48px; border-radius: 50%; background: #F5DADA; color: #8E3F3F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="3.5"/><path d="M5.5 19a6.5 6.5 0 0 1 13 0"/></svg>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">我的帳號</span>
          <span style="font-size: 12px; color: #6E6860">用 Google 帳號登入</span>
        </div>
      </div>
      <div style="{{statusBox}}">
        <span style="{{statusIcon}}">
          <sc-if value="{{syncing}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="animation: spin 900ms linear infinite"><path d="M12 4a8 8 0 1 1-8 8"/></svg>
          </sc-if>
          <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          </sc-if>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 700">{{statusTitle}}</span>
          <span style="font-size: 12px">{{statusSub}}</span>
        </div>
        <button onClick="{{syncNow}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; cursor: pointer; background: #3D3A36; color: #FFFFFF; font-size: 13px; font-weight: 700; flex-shrink: 0">立即同步</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 700; color: #6E6860; padding: 0 6px">已同步的裝置</div>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 0 16px">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid #F3EEE7">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: #DCE8F5; color: #3E5F8F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 17.5h2"/></svg>
          </span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px">iPhone</span>
            <span style="font-size: 12px; color: #6E6860">這台裝置</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 58px">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: #E8E0F3; color: #65508F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="10" rx="2"/><path d="M3 19h18"/></svg>
          </span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px">MacBook</span>
            <span style="font-size: 12px; color: #6E6860">昨天 22:10 使用過</span>
          </div>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 0 16px">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
        <div style="{{t.wrap}}">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px">{{t.label}}</span>
            <span style="font-size: 12px; color: #6E6860">{{t.sub}}</span>
          </div>
          <button onClick="{{t.flip}}" role="switch" aria-checked="{{t.aria}}" aria-label="{{t.label}}" style="{{t.track}}">
            <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 700; color: #6E6860; padding: 0 6px">備份紀錄</div>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 0 16px">
        <sc-for list="{{backups}}" as="b" hint-placeholder-count="3">
          <div style="{{b.wrap}}">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 15px; font-variant-numeric: tabular-nums">{{b.date}}</span>
              <span style="font-size: 12px; color: #6E6860">{{b.meta}}</span>
            </div>
            <button onClick="{{b.restore}}" style="{{b.btn}}">{{b.btnText}}</button>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #6E6860; padding: 0 6px">還原會用那天的資料取代目前的資料，會先再確認一次</span>
    </div>

    <button style="height: 50px; border-radius: 18px; border: none; background: #FFFFFF; cursor: pointer; font-size: 15px; font-weight: 700; color: #A0605A">登出</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { syncing: false, last: '今天 14:52', auto: true, wifi: false, picked: null };
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }
  renderVals() {
    var self = this;
    var st = this.state;
    function track(on) { return 'width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; cursor: pointer; flex-shrink: 0; display: flex; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#8DB58F' : '#D9D2C7'); }
    var tg = [
      { key: 'auto', label: '每天自動備份', sub: '每晚 3:00 備份一次，保留 30 天' },
      { key: 'wifi', label: '只在 Wi-Fi 下同步', sub: '省行動網路流量' }
    ];
    var bks = [['10/24（六）03:00', '自動備份 · 1.2 MB'], ['10/23（五）03:00', '自動備份 · 1.2 MB'], ['10/22（四）03:00', '自動備份 · 1.1 MB']];
    return {
      syncing: st.syncing,
      idle: !st.syncing,
      statusTitle: st.syncing ? '同步中…' : '資料都同步好了',
      statusSub: st.syncing ? '請稍等一下' : '上次同步：' + st.last,
      statusBox: 'border-radius: 16px; padding: 10px 10px 10px 12px; display: flex; align-items: center; gap: 10px; ' + (st.syncing ? 'background: #ECE9E4; color: #4F4A44' : 'background: #D6EEE8; color: #36705F'),
      statusIcon: 'width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + (st.syncing ? '#9C958C' : '#5E9F8E'),
      syncNow: function () {
        if (self.state.syncing) return;
        self.setState({ syncing: true });
        self._t = setTimeout(function () { self.setState({ syncing: false, last: '剛剛' }); }, 1400);
      },
      toggles: tg.map(function (t, i) {
        var on = !!st[t.key];
        return {
          label: t.label, sub: t.sub, aria: on ? 'true' : 'false', track: track(on),
          wrap: 'display: flex; align-items: center; gap: 12px; min-height: 64px' + (i < tg.length - 1 ? '; border-bottom: 1px solid #F3EEE7' : ''),
          flip: function () { var p = {}; p[t.key] = !self.state[t.key]; self.setState(p); }
        };
      }),
      backups: bks.map(function (b, i) {
        var sel = st.picked === i;
        return {
          date: b[0], meta: b[1],
          btnText: sel ? '確定還原？' : '還原',
          restore: function () { self.setState({ picked: self.state.picked === i ? null : i }); },
          wrap: 'display: flex; align-items: center; gap: 12px; min-height: 58px' + (i < bks.length - 1 ? '; border-bottom: 1px solid #F3EEE7' : ''),
          btn: 'height: 34px; padding: 0 14px; border-radius: 17px; border: none; cursor: pointer; font-size: 13px; font-weight: 700; flex-shrink: 0; ' + (sel ? 'background: #A0605A; color: #FFFFFF' : 'background: #F5F1EA; color: #5A544C')
        };
      })
    };
  }
}
</script>
</body>
</html>
