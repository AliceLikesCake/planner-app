        .concat([
          sph(103, 6, 18, '#F5DADA', '#FFFFFF', '#D99A9A'), sph(119, 6, 18, '#F5DADA', '#FFFFFF', '#D99A9A'),
          sph(98, 18, 18, '#F5DADA', '#FFFFFF', '#D99A9A'), sph(124, 18, 18, '#F5DADA', '#FFFFFF', '#D99A9A'),
          sph(111, 27, 18, '#F5DADA', '#FFFFFF', '#D99A9A'), sph(113, 15, 14, '#F2D78A', '#FFF6D6', '#CDAA4C')
        ])
        .concat(ring(6, Math.round(topG.w / 2) - 8, ryTop - 2, 12, dollop).slice(3));
    }

    var plateRy = cylinder ? botG.ry : 8;
    var week = cakes.map(function (c, i) {
      var on = i === self.state.day;
      return {
        label: en ? c.wdEn : c.wd,
        aria: (en ? 'Show ' + c.en : '看' + c.zh),
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ day: i, last: null }); },
        style: 'height: 42px; min-width: 0; border-radius: 14px; border: none; cursor: pointer; padding: 0; font-size: 15px; font-weight: 700; background: ' + (on ? '#3D3A36' : '#F5F1EA') + '; color: ' + (on ? '#FFFFFF' : '#5A544C') + (i === 3 && !on ? '; box-shadow: inset 0 0 0 1.5px #E0A07F' : '')
      };
    });

    var items = tasks.map(function (t) {
      var f = fl[t.f];
      var d = order.indexOf(t.id) !== -1;
      var title = en ? t.en : t.zh;
      return {
        done: d,
        pressed: d ? 'true' : 'false',
        title: title,
        time: t.time,
        cat: en ? f.ce : f.cz,
        isWork: t.f === 'work', isCollab: t.f === 'collab', isGig: t.f === 'gig', isStudy: t.f === 'study', isLife: t.f === 'life', isHealth: t.f === 'health',
        aria: (d ? s.undoL : s.doL) + '：' + title,
        cardStyle: 'width: 100%; flex-shrink: 0; border: none; cursor: pointer; border-radius: 20px; padding: 10px 14px 10px 10px; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #3D3A36; background: ' + (d ? '#F3F0EB' : '#FFFFFF'),
        iconStyle: 'width: 40px; height: 40px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + (d ? '#E6E2DC' : f.fill) + '; color: ' + (d ? '#8C857B' : f.text),
        checkStyle: 'width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (d ? 'background: #A8A198; border: none' : 'background: #FFFFFF; border: 2px solid ' + mix(f.text, '#FFFFFF', 0.45)) + (d && t.id === self.state.last ? '; animation: bounce 400ms ease-out' : ''),
        titleStyle: 'font-size: 15px; font-weight: 500; ' + (d ? 'color: #8C857B; text-decoration: line-through' : ''),
        chip: 'font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: ' + (d ? '#E6E2DC' : f.fill) + '; color: ' + (d ? '#6E6860' : f.text),
        toggle: function () {
          var cur = self.state.order.slice();
          var i = cur.indexOf(t.id);
          if (i === -1) {
            cur.push(t.id);
            self.setState({ order: cur, last: t.id });
            var cnt = cur.filter(function (id) { return !!byId[id]; }).length;
            self.playStack(cnt);
            if (cnt === total) self.playFanfare();
          } else {
            cur.splice(i, 1);
            self.setState({ order: cur, last: null });
            self.playUndo();
          }
        }
      };
    });

    var names = order.map(function (id) { var f = fl[byId[id].f]; return en ? f.en : f.zh; });
    var presets = ['few', 'normal', 'many'].map(function (key) {
      var on = key === self.state.preset;
      var p = presetDefs[key];
      return {
        label: en ? p.en : p.zh,
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ preset: key, order: p.order.slice(), last: null }); },
        style: 'height: 32px; padding: 0 12px; border-radius: 16px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; background: ' + (on ? '#3D3A36' : '#F5F1EA') + '; color: ' + (on ? '#FFFFFF' : '#5A544C')
      };
    });
    var soundOn = !!this.state.sound;
    return {
      s: s,
      soundOn: soundOn,
      soundOff: !soundOn,
      soundPressed: soundOn ? 'true' : 'false',
      soundAria: en ? (soundOn ? 'Sound on, tap to mute' : 'Sound off, tap to turn on') : (soundOn ? '音效開啟，點一下關閉' : '音效關閉，點一下開啟'),
      soundStyle: 'width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: ' + (soundOn ? '#F1ECE4' : '#FFFFFF') + '; color: ' + (soundOn ? '#3D3A36' : '#6E6860') + '; box-shadow: ' + (soundOn ? 'none' : 'inset 0 0 0 1px #E2DACE'),
      toggleSound: function () {
        var next = !self.state.sound;
        self.setState({ sound: next });
        if (next) self.tone(659, 659, 0, 0.15, 'sine', 0.12);
      },
      presets: presets,
      week: week,
      items: items,
      layers: layers,
      deco: deco,
      base: baseEls,
      allDone: allDone,
      msg: allDone ? s.done(cakeLabel) : s.left(total - n),
      msgStyle: allDone
        ? "background: #F5DADA; color: #8E3F3F; border-radius: 10px; padding: 4px 8px; font-size: 12px; font-weight: 700; line-height: 1.4"
        : 'font-size: 12px; color: #6E6860; line-height: 1.4',
      weekLabel: en ? cake.wdEn + ' special' : '週' + cake.wd + '限定',
      cakeShort: en ? cake.en.charAt(0).toUpperCase() + cake.en.slice(1) : cake.zh,
      doneN: n,
      totalN: total,
      listCount: (en ? 'Done ' : '完成 ') + n + ' / ' + total,
      barStyle: 'height: 100%; border-radius: 4px; background: #E3A889; transition: width 300ms ease; width: ' + Math.round(n / total * 100) + '%',
      decoBox: 'position: relative; z-index: 50; width: 240px; height: 64px; margin-bottom: ' + (-ryTop - (cylinder ? 0 : 4)) + 'px; animation: fadein 500ms ease-out',
      plateStyle: 'position: relative; z-index: 0; width: ' + (cid === 'cupcake' ? 210 : (cid === 'sundae' ? 170 : (cid === 'classic' ? 236 : 276))) + 'px; height: ' + (2 * plateRy + 16) + 'px; margin-top: ' + (-(plateRy + 10)) + 'px; border-radius: 50%; background: radial-gradient(ellipse at 50% 38%, #FFFFFF 0%, #F3EEE5 52%, #DCD2C2 100%); box-shadow: 0 10px 16px rgba(61,58,54,0.14)',
      cakeName: (en ? cake.wdEn + ' · ' + cake.en.charAt(0).toUpperCase() + cake.en.slice(1) : '週' + cake.wd + '限定・' + cake.zh),
      layerText: n + ' / ' + total + ' ' + s.layer,
      cakeAria: cakeLabel + (en ? ' with layers: ' : '，已疊上：') + (names.length ? names.join(en ? ', ' : '、') : (en ? 'none yet' : '還沒有')),
      cakeStyle: 'display: flex; flex-direction: column; align-items: center; transform-origin: bottom center; scale: 0.56' + (allDone ? '; animation: celebrate 700ms ease-out forwards' : ''),
      toggleLang: function () { self.setState({ lang: self.state.lang === 'en' ? 'zh' : 'en' }); }
    };
  }
}
</script>
</body>
</html>
