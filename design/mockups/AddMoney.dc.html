<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>記一筆</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3A36}a:hover{color:#1F1D1B}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #FAF7F2; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3D3A36; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 50px 12px 6px">
    <a href="Money.dc.html" style="height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; color: #6E6860; text-decoration: none">取消</a>
    <div style="background: #F1ECE4; border-radius: 16px; padding: 3px; display: flex; gap: 2px">
      <button onClick="{{showOut}}" aria-pressed="{{outPressed}}" style="{{outTab}}">支出</button>
      <button onClick="{{showIn}}" aria-pressed="{{inPressed}}" style="{{inTab}}">收入</button>
    </div>
    <a href="Money.dc.html" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #3D3A36; color: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">儲存</a>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
      <span style="{{catBadge}}">{{catName}}</span>
      <span style="{{amtStyle}}">{{amtText}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
          <span style="{{c.icon}}">
            <sc-if value="{{c.isFood}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-1.7 0-3 2-3 5s1.3 4 3 4v9"/></svg></sc-if>
            <sc-if value="{{c.isShop}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg></sc-if>
            <sc-if value="{{c.isLife}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8H4zM10 19v-5h4v5"/></svg></sc-if>
            <sc-if value="{{c.isTransit}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="13" rx="3"/><path d="M5 11h14M8 20l1.5-3M16 20l-1.5-3"/></svg></sc-if>
            <sc-if value="{{c.isSub}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg></sc-if>
            <sc-if value="{{c.isHealth}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19s-7-4.5-7-9.5A4 4 0 0 1 12 7a4 4 0 0 1 7 2.5C19 14.5 12 19 12 19z"/></svg></sc-if>
            <sc-if value="{{c.isFun}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="3"/><path d="M8 10v4M6 12h4M15.5 11h.01M17.5 13h.01"/></svg></sc-if>
            <sc-if value="{{c.isOther}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg></sc-if>
            <sc-if value="{{c.isSalary}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5h6v2M3 12.5h18"/></svg></sc-if>
            <sc-if value="{{c.isCollab}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg></sc-if>
            <sc-if value="{{c.isGig}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="10" rx="2"/><path d="M3 19h18"/></svg></sc-if>
          </span>
          <span style="font-size: 12px">{{c.name}}</span>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{isCollabIncome}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 12px; font-weight: 700; color: #6E6860">是哪個接案的款項？</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{deals}}" as="d" hint-placeholder-count="3">
            <button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="{{d.style}}">{{d.name}}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5A544C; background: #F1ECE4; border-radius: 12px; padding: 8px 10px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          <span>{{dealSync}}</span>
        </div>
      </div>
    </sc-if>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #F3EEE7">
        <label for="m-date" style="font-size: 15px">日期</label>
        <input id="m-date" type="text" value="10月24日（六）" style="border: none; outline: none; text-align: right; font-size: 15px; font-weight: 700; color: #3D3A36; background: transparent; width: 150px">
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px">
        <label for="m-note" style="font-size: 15px">備註</label>
        <input id="m-note" type="text" value="{{noteVal}}" style="border: none; outline: none; text-align: right; font-size: 15px; color: #3D3A36; background: transparent; width: 200px">
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 12px 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 48px; border: none; border-radius: 14px; background: #F5F1EA; cursor: pointer; font-size: 20px; font-weight: 700; color: #3D3A36; font-variant-numeric: tabular-nums">{{k.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'out', amt: '180', cat: 'food', deal: 'b' };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var out = st.view === 'out';
    var on = 'height: 34px; padding: 0 18px; border: none; border-radius: 13px; background: #FFFFFF; color: #3D3A36; font-size: 14px; font-weight: 700; cursor: pointer';
    var off = 'height: 34px; padding: 0 18px; border: none; border-radius: 13px; background: transparent; color: #6E6860; font-size: 14px; font-weight: 500; cursor: pointer';
    var C = {
      food: { name: '餐飲', fill: '#F8E1D4', text: '#8A4A2B' },
      shop: { name: '購物', fill: '#E8E0F3', text: '#65508F' },
      life: { name: '生活', fill: '#F6EBC8', text: '#7F6224' },
      transit: { name: '交通', fill: '#DCE8F5', text: '#3E5F8F' },
      fun: { name: '娛樂', fill: '#DDEBDD', text: '#3D6442' },
      health: { name: '醫療', fill: '#F5DADA', text: '#8E3F3F' },
      sub: { name: '訂閱', fill: '#F6DDE9', text: '#8A3D62' },
      other: { name: '其他', fill: '#EDE8E1', text: '#5A544C' },
      salary: { name: '薪資', fill: '#D6EEE8', text: '#36705F' },
      collab: { name: '接案', fill: '#E8E0F3', text: '#65508F' },
      gig: { name: '接案', fill: '#F8E1D4', text: '#8A4A2B' }
    };
    var ids = out ? ['food', 'shop', 'life', 'transit', 'fun', 'health', 'sub', 'other'] : ['salary', 'collab', 'other'];
    var cat = ids.indexOf(st.cat) === -1 ? ids[0] : st.cat;
    var cc = C[cat];
    var deals = [{ id: 'b', name: '品牌 B', amt: '12000' }, { id: 'a', name: '品牌 A', amt: '8000' }, { id: 'd', name: '品牌 D', amt: '6000' }];
    var curDeal = deals.filter(function (d) { return d.id === st.deal; })[0];
    var keyDefs = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'del'];
    var n = parseInt(st.amt || '0', 10);
    return {
      outPressed: out ? 'true' : 'false',
      inPressed: out ? 'false' : 'true',
      outTab: out ? on : off,
      inTab: out ? off : on,
      showOut: function () { self.setState({ view: 'out', cat: 'food', amt: '180' }); },
      showIn: function () { self.setState({ view: 'in', cat: 'collab', amt: '12000', deal: 'b' }); },
      catName: cc.name,
      catBadge: 'font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 14px; background: ' + cc.fill + '; color: ' + cc.text,
      amtText: (out ? '−' : '+') + ' $' + n.toLocaleString('en-US'),
      amtStyle: "font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 32px; font-variant-numeric: tabular-nums; color: " + (out ? '#3D3A36' : '#36705F'),
      cats: ids.map(function (id) {
        var c = C[id];
        var sel = id === cat;
        return {
          name: c.name, pressed: sel ? 'true' : 'false',
          isFood: id === 'food', isShop: id === 'shop', isLife: id === 'life', isTransit: id === 'transit', isSub: id === 'sub', isHealth: id === 'health', isFun: id === 'fun', isOther: id === 'other', isSalary: id === 'salary', isCollab: id === 'collab', isGig: id === 'gig',
          pick: function () { var p = { cat: id }; if (id === 'collab') { p.amt = curDeal.amt; } self.setState(p); },
          icon: 'width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: ' + (sel ? '#FFFFFF' : c.fill) + '; color: ' + c.text,
          style: 'height: 72px; border-radius: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 0; border: 2px solid ' + (sel ? c.text : 'transparent') + '; background: ' + (sel ? c.fill : '#FFFFFF') + '; color: ' + (sel ? c.text : '#5A544C') + '; font-weight: ' + (sel ? '700' : '500')
        };
      }),
      isCollabIncome: !out && cat === 'collab',
      deals: deals.map(function (d) {
        var sel = d.id === st.deal;
        return {
          name: d.name, pressed: sel ? 'true' : 'false',
          pick: function () { self.setState({ deal: d.id, amt: d.amt }); },
          style: 'height: 36px; padding: 0 14px; border-radius: 18px; border: none; cursor: pointer; font-size: 13px; font-weight: ' + (sel ? '700' : '500') + '; background: ' + (sel ? '#3D3A36' : '#F5F1EA') + '; color: ' + (sel ? '#FFFFFF' : '#5A544C')
        };
      }),
      dealSync: '接案頁的「' + curDeal.name + '」會自動改成已入帳',
      noteVal: !out && cat === 'collab' ? curDeal.name + ' 接案款' : (out ? '下午咖啡' : ''),
      keys: keyDefs.map(function (k) {
        return {
          label: k === 'del' ? '⌫' : k,
          aria: k === 'del' ? '刪除' : k,
          press: function () {
            var a = self.state.amt === '0' ? '' : self.state.amt;
            if (k === 'del') a = a.slice(0, -1);
            else if (a.length < 8) a = a + k;
            a = a.replace(/^0+/, '');
            self.setState({ amt: a || '0' });
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
