<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>記帳</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D3A36}a:hover{color:#1F1D1B}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #FAF7F2; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3D3A36; overflow: hidden">
  <div style="flex: 1; overflow-y: auto; padding: 50px 16px 110px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
      <div style="font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 26px">記帳</div>
      <div style="display: flex; align-items: center; gap: 4px">
        <button aria-label="上個月" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span style="font-size: 15px; font-weight: 700">2026年10月</span>
        <button aria-label="下個月" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #6E6860">本月結餘</span>
        <span style="font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 34px; font-variant-numeric: tabular-nums">NT$20,270</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid #F1ECE4; padding-top: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px; padding-right: 12px; border-right: 1px solid #F1ECE4">
          <span style="font-size: 12px; color: #6E6860">收入</span>
          <span style="font-size: 20px; font-weight: 700; color: #36705F; font-variant-numeric: tabular-nums">+38,500</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 14px">
          <span style="font-size: 12px; color: #6E6860">支出</span>
          <span style="font-size: 20px; font-weight: 700; color: #8A4A2B; font-variant-numeric: tabular-nums">−18,230</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6E6860; font-variant-numeric: tabular-nums">
          <span>預算 $25,000 · 已用 73%</span>
          <span>剩 $6,770</span>
        </div>
        <div style="height: 8px; border-radius: 4px; background: #F1ECE4; overflow: hidden">
          <div style="height: 100%; width: 73%; border-radius: 4px; background: #E0A07F"></div>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px">
        <div style="background: #F1ECE4; border-radius: 16px; padding: 3px; display: flex; gap: 2px">
          <button onClick="{{showOut}}" aria-pressed="{{outPressed}}" style="{{outTab}}">支出</button>
          <button onClick="{{showIn}}" aria-pressed="{{inPressed}}" style="{{inTab}}">收入</button>
        </div>
        <span style="font-size: 13px; color: #6E6860; font-variant-numeric: tabular-nums">{{sumText}}</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #F5F1EA">
          <span style="{{r.icon}}">
            <sc-if value="{{r.isFood}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-1.7 0-3 2-3 5s1.3 4 3 4v9"/></svg></sc-if>
            <sc-if value="{{r.isShop}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg></sc-if>
            <sc-if value="{{r.isLife}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8H4zM10 19v-5h4v5"/></svg></sc-if>
            <sc-if value="{{r.isTransit}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="13" rx="3"/><path d="M5 11h14M8 20l1.5-3M16 20l-1.5-3"/></svg></sc-if>
            <sc-if value="{{r.isSub}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg></sc-if>
            <sc-if value="{{r.isOther}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg></sc-if>
            <sc-if value="{{r.isSalary}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5h6v2M3 12.5h18"/></svg></sc-if>
            <sc-if value="{{r.isCollab}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg></sc-if>
          </span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
              <span style="font-size: 15px; font-weight: 500">{{r.name}}</span>
              <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.amt}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px">
              <div style="flex: 1; height: 6px; border-radius: 3px; background: #F3EEE6; overflow: hidden">
                <div style="{{r.bar}}"></div>
              </div>
              <span style="width: 34px; text-align: right; font-size: 12px; color: #6E6860; font-variant-numeric: tabular-nums">{{r.pct}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
        <div style="font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 18px">明細</div>
        <a href="#" style="height: 34px; padding: 0 12px; border-radius: 17px; background: #F1ECE4; display: flex; align-items: center; font-size: 13px; font-weight: 700; text-decoration: none">匯出 Excel</a>
      </div>
      <sc-for list="{{days}}" as="dy" hint-placeholder-count="3">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 16px">
          <div style="display: flex; justify-content: space-between; align-items: center; height: 38px; font-size: 13px; color: #6E6860; border-bottom: 1px solid #F5F1EA; font-variant-numeric: tabular-nums">
            <span style="font-weight: 700">{{dy.label}}</span>
            <span>{{dy.total}}</span>
          </div>
          <sc-for list="{{dy.items}}" as="t" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 46px">
              <span style="{{t.dot}}"></span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 15px">{{t.name}}</span>
                <span style="font-size: 12px; color: #6E6860">{{t.meta}}</span>
              </div>
              <span style="{{t.amtStyle}}">{{t.amt}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>

  <a href="AddMoney.dc.html" aria-label="新增一筆記帳" style="position: absolute; right: 20px; bottom: 100px; width: 56px; height: 56px; border-radius: 28px; background: #3D3A36; display: flex; align-items: center; justify-content: center; z-index: 5">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </a>

  <nav style="height: 84px; flex-shrink: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -4px 20px rgba(61,58,54,0.06); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px 14px; box-sizing: border-box; position: relative; z-index: 4">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6E6860; font-size: 11px; font-weight: 500">
      <span style="width: 52px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M5 20v-6h14v6M7 14v-4h10v4M12 10V7"/><path d="M12 4.5c.8.6.8 1.6 0 2"/></svg></span>
      <span>今日</span>
    </a>
    <a href="Calendar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6E6860; font-size: 11px; font-weight: 500">
      <span style="width: 52px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <span>月曆</span>
    </a>
    <a href="Goals.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6E6860; font-size: 11px; font-weight: 500">
      <span style="width: 52px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span>
      <span>習慣</span>
    </a>
    <a href="Collabs.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6E6860; font-size: 11px; font-weight: 500">
      <span style="width: 52px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.5V4.5h8l9 9-8 8z"/><circle cx="8" cy="9" r="1.5"/></svg></span>
      <span>接案</span>
    </a>
    <a href="Money.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #3D3A36; font-size: 11px; font-weight: 700">
      <span style="width: 52px; height: 32px; border-radius: 16px; background: #F1ECE4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="4"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg></span>
      <span>記帳</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'out' };
  }
  renderVals() {
    var self = this;
    var out = this.state.view === 'out';
    var on = 'height: 34px; padding: 0 18px; border: none; border-radius: 13px; background: #FFFFFF; color: #3D3A36; font-size: 14px; font-weight: 700; cursor: pointer';
    var off = 'height: 34px; padding: 0 18px; border: none; border-radius: 13px; background: transparent; color: #6E6860; font-size: 14px; font-weight: 500; cursor: pointer';
    var C = {
      food: { name: '餐飲', fill: '#F8E1D4', text: '#8A4A2B', bar: '#E0A07F' },
      shop: { name: '購物', fill: '#E8E0F3', text: '#65508F', bar: '#A891CC' },
      life: { name: '生活', fill: '#F6EBC8', text: '#7F6224', bar: '#D9BC6E' },
      transit: { name: '交通', fill: '#DCE8F5', text: '#3E5F8F', bar: '#7FA3CF' },
      sub: { name: '訂閱', fill: '#F5DADA', text: '#8E3F3F', bar: '#DE9C9C' },
      other: { name: '其他', fill: '#EDE8E1', text: '#5A544C', bar: '#B5ADA2' },
      salary: { name: '薪資', fill: '#D6EEE8', text: '#36705F', bar: '#7DBFB0' },
      collab: { name: '接案', fill: '#E8E0F3', text: '#65508F', bar: '#A891CC' }
    };
    var expense = [['food', 6420], ['shop', 4300], ['life', 2870], ['transit', 1850], ['other', 1800], ['sub', 990]];
    var income = [['salary', 33500], ['collab', 5000]];
    var list = out ? expense : income;
    var sum = list.reduce(function (s, r) { return s + r[1]; }, 0);
    var rows = list.map(function (r) {
      var c = C[r[0]];
      var p = r[1] / sum * 100;
      return {
        name: c.name,
        amt: '$' + r[1].toLocaleString('en-US'),
        pct: Math.round(p) + '%',
        isFood: r[0] === 'food', isShop: r[0] === 'shop', isLife: r[0] === 'life', isTransit: r[0] === 'transit', isSub: r[0] === 'sub', isOther: r[0] === 'other', isSalary: r[0] === 'salary', isCollab: r[0] === 'collab',
        icon: 'width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + c.fill + '; color: ' + c.text,
        bar: 'height: 100%; border-radius: 3px; background: ' + c.bar + '; width: ' + p.toFixed(1) + '%'
      };
    });
    var tx = {
      '10/22': [['午餐便當', 'food', -150, '12:20'], ['捷運', 'transit', -40, '08:10']],
      '10/20': [['品牌 C 接案入帳', 'collab', 5000, '自動新增'], ['超市採買', 'life', -620, '19:40']],
      '10/19': [['咖啡廳', 'food', -180, '15:00'], ['網購保養品', 'shop', -1280, '22:30']]
    };
    var labels = { '10/22': '10/22 星期四', '10/20': '10/20 星期二', '10/19': '10/19 星期一' };
    var days = Object.keys(tx).map(function (k) {
      var t = 0;
      var items = tx[k].map(function (x) {
        var c = C[x[1]];
        t += x[2];
        var pos = x[2] > 0;
        return {
          name: x[0],
          meta: c.name,
          amt: (pos ? '+' : '−') + Math.abs(x[2]).toLocaleString('en-US'),
          dot: 'width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: ' + c.bar,
          amtStyle: 'font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (pos ? '#36705F' : '#3D3A36')
        };
      });
      return { label: labels[k], total: (t >= 0 ? '+' : '−') + Math.abs(t).toLocaleString('en-US'), items: items };
    });
    return {
      rows: rows,
      days: days,
      sumText: (out ? '共 $' : '共 $') + sum.toLocaleString('en-US'),
      outPressed: out ? 'true' : 'false',
      inPressed: out ? 'false' : 'true',
      outTab: out ? on : off,
      inTab: out ? off : on,
      showOut: function () { self.setState({ view: 'out' }); },
      showIn: function () { self.setState({ view: 'in' }); }
    };
  }
}
</script>
</body>
</html>
